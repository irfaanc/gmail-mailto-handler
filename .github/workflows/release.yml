# Builds both binaries and publishes the release, triggered by pushing a tag.
#
# The point is that every release detail that used to be copied by hand is now
# derived: the version from the tag, the hashes from the files just built, the
# commit from the checkout. Each of those was got wrong at least once by hand.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # The tag is the single source of truth for the version. Without this the
      # csproj's hardcoded <Version> ships regardless of what was tagged, which
      # is how a v1.0.1 tag would quietly produce 1.0.0 binaries.
      - name: Version from tag
        id: version
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          "number=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Building $v from ${{ github.sha }}"

      - name: Publish
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          dotnet publish GmailTo.csproj -c Release -o publish     -p:Version=$env:VERSION --nologo
          dotnet publish GmailTo.csproj -c Release -o publish-x64 -p:Version=$env:VERSION --nologo -r win-x64
          New-Item -ItemType Directory -Force artifacts | Out-Null
          # Both publishes emit GmailTo.exe, so the 64-bit one is renamed rather
          # than overwriting the other.
          Copy-Item publish\GmailTo.exe     artifacts\GmailTo.exe
          Copy-Item publish-x64\GmailTo.exe artifacts\GmailTo-x64.exe

      # The SDK derives SourceRevisionId from git metadata, giving binaries a
      # "<version>+<sha>" product version. It fails silently, and a release whose
      # binaries cannot be traced back to a commit is worth stopping for.
      - name: Check the commit is embedded
        shell: pwsh
        run: |
          foreach ($f in "artifacts\GmailTo.exe", "artifacts\GmailTo-x64.exe") {
            $pv = (Get-Item $f).VersionInfo.ProductVersion
            Write-Host "$f -> $pv"
            if ($pv -notmatch '\+[0-9a-f]{40}$') {
              throw "$f has no commit in its product version ($pv)"
            }
          }

      - name: Build the notes
        shell: pwsh
        run: |
          $x86 = (Get-FileHash artifacts\GmailTo.exe     -Algorithm SHA256).Hash
          $x64 = (Get-FileHash artifacts\GmailTo-x64.exe -Algorithm SHA256).Hash
          $short = "${{ github.sha }}".Substring(0, 7)
          $fence = [string][char]96 * 3
          $tick = [string][char]96
          $generated = @(
            ''
            '## Verifying the download'
            ''
            '| file | SHA256 |'
            '| --- | --- |'
            "| ${tick}GmailTo.exe${tick} | ${tick}${x86}${tick} |"
            "| ${tick}GmailTo-x64.exe${tick} | ${tick}${x64}${tick} |"
            ''
            ($fence + 'powershell')
            'Get-FileHash GmailTo.exe -Algorithm SHA256'
            $fence
            ''
            "Built from $short, which each binary records in its file version."
          )
          $prose = Get-Content .github\release-notes.md -Raw
          Set-Content notes.md ($prose.TrimEnd() + "`n" + ($generated -join "`n")) -Encoding utf8
          Write-Host "--- notes.md ---"
          Get-Content notes.md | Select-Object -Last 14

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          gh release create "${{ github.ref_name }}" `
            artifacts\GmailTo.exe artifacts\GmailTo-x64.exe `
            --title "gmailto $env:VERSION" `
            --notes-file notes.md
